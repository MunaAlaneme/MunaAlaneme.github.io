<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muna's Animations</title>
    <link href="style1.css" rel="stylesheet" type="text/css">
    <style>
        body {
            font-family: Dosis, 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        button {
            font-family: Dosis, 'Arial', sans-serif;
            background-color: #855CD6;
            color: #fff;
            text-align: center;
            font-size: 24px;
            text-shadow: -1px -1px 0 #000, 0px -1px 0 #000, 1px -1px 0 #000, -1px 0px 0 #000, 1px 0px 0 #000, -1px 1px 0 #000, 0px 1px 0 #000, 1px 1px 0 #000;
            -webkit-text-stroke: 1px #fff;
        }

        @keyframes moveBox {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 16px;
            text-align: center;
            font-size: 24px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .content {
            margin-top: 40px; /* Adjust this value based on your header height */
            padding: 20px;
        }

        @keyframes bouncecircle {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .slidecontainer {
            width: 90%;
            padding-left: 5%;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 35px;
            border-radius: 5px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
        }
        .slider:hover {
            opacity: 1;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 50px;
            border-radius: 25%;
            background: #04AA6D;
            cursor: pointer;
        }
        .slider::-moz-range-thumb {
            width: 50px;
            height: 50px;
            border-radius: 25%;
            background: #04AA6D;
            cursor: pointer;
        }
    </style>
</head>
<body>

        Muna's Animations
    </header>
